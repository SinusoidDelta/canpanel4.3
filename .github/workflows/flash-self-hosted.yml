name: Flash self-hosted ESP32 lab board

on:
  workflow_dispatch:
    inputs:
      port:
        description: Serial port on the self-hosted runner, for example /dev/ttyUSB0 or /dev/ttyACM0
        required: true
        default: /dev/ttyUSB0

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: firmware

      - name: Upload firmware build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canpanel43-firmware
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/*.map
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
            firmware/build/flasher_args.json
          if-no-files-found: error

  flash:
    needs: build-artifact
    runs-on: [self-hosted, linux, x64, esp32-lab]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current workflow build artifacts
        uses: actions/download-artifact@v4
        with:
          name: canpanel43-firmware
          path: firmware/build

      - name: Flash attached ESP32-S3 board
        working-directory: firmware
        run: |
          set -euo pipefail
          echo "This job only works on a self-hosted runner with USB access to the Waveshare ESP32-S3-Touch-LCD-4.3B-BOX."
          idf.py -p "${{ inputs.port }}" flash
